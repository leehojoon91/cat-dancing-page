<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="155" rx="55" ry="50" fill="#FF8C69"/>
  <!-- Head -->
  <circle cx="100" cy="85" r="48" fill="#FF8C69"/>
  <!-- Left ear -->
  <polygon points="60,50 45,15 80,40" fill="#FF8C69"/>
  <polygon points="63,47 52,22 76,42" fill="#FFB6C1"/>
  <!-- Right ear -->
  <polygon points="140,50 155,15 120,40" fill="#FF8C69"/>
  <polygon points="137,47 148,22 124,42" fill="#FFB6C1"/>
  <!-- Face -->
  <!-- Eyes -->
  <ellipse cx="80" cy="82" rx="10" ry="11" fill="white"/>
  <ellipse cx="120" cy="82" rx="10" ry="11" fill="white"/>
  <circle cx="82" cy="84" r="6" fill="#2C2C2C"/>
  <circle cx="122" cy="84" r="6" fill="#2C2C2C"/>
  <circle cx="84" cy="81" r="2" fill="white"/>
  <circle cx="124" cy="81" r="2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="100" cy="98" rx="5" ry="4" fill="#FF69B4"/>
  <!-- Mouth -->
  <path d="M 92 103 Q 100 110 108 103" stroke="#CC5577" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Whiskers left -->
  <line x1="50" y1="96" x2="88" y2="100" stroke="#666" stroke-width="1.5"/>
  <line x1="50" y1="102" x2="88" y2="103" stroke="#666" stroke-width="1.5"/>
  <line x1="55" y1="108" x2="88" y2="106" stroke="#666" stroke-width="1.5"/>
  <!-- Whiskers right -->
  <line x1="150" y1="96" x2="112" y2="100" stroke="#666" stroke-width="1.5"/>
  <line x1="150" y1="102" x2="112" y2="103" stroke="#666" stroke-width="1.5"/>
  <line x1="145" y1="108" x2="112" y2="106" stroke="#666" stroke-width="1.5"/>
  <!-- Belly -->
  <ellipse cx="100" cy="158" rx="30" ry="28" fill="#FFDAB9"/>
  <!-- Left arm -->
  <ellipse cx="50" cy="150" rx="14" ry="22" fill="#FF8C69" transform="rotate(-20, 50, 150)"/>
  <!-- Right arm -->
  <ellipse cx="150" cy="150" rx="14" ry="22" fill="#FF8C69" transform="rotate(20, 150, 150)"/>
  <!-- Left paw -->
  <ellipse cx="42" cy="168" rx="12" ry="9" fill="#FF8C69"/>
  <circle cx="36" cy="170" r="4" fill="#FFDAB9"/>
  <circle cx="43" cy="174" r="4" fill="#FFDAB9"/>
  <circle cx="50" cy="171" r="4" fill="#FFDAB9"/>
  <!-- Right paw -->
  <ellipse cx="158" cy="168" rx="12" ry="9" fill="#FF8C69"/>
  <circle cx="152" cy="171" r="4" fill="#FFDAB9"/>
  <circle cx="159" cy="174" r="4" fill="#FFDAB9"/>
  <circle cx="166" cy="170" r="4" fill="#FFDAB9"/>
  <!-- Left leg -->
  <ellipse cx="75" cy="200" rx="16" ry="22" fill="#FF8C69"/>
  <!-- Right leg -->
  <ellipse cx="125" cy="200" rx="16" ry="22" fill="#FF8C69"/>
  <!-- Left foot -->
  <ellipse cx="70" cy="215" rx="18" ry="9" fill="#FF8C69"/>
  <!-- Right foot -->
  <ellipse cx="130" cy="215" rx="18" ry="9" fill="#FF8C69"/>
  <!-- Tail -->
  <path d="M 148 175 Q 190 160 185 130 Q 180 110 165 118" stroke="#FF8C69" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Tail tip -->
  <circle cx="163" cy="117" r="10" fill="#FFB6C1"/>
  <!-- Blush cheeks -->
  <ellipse cx="68" cy="100" rx="10" ry="6" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="132" cy="100" rx="10" ry="6" fill="#FFB6C1" opacity="0.6"/>
  <!-- Music notes -->
  <text x="10" y="50" font-size="22" fill="#FF69B4" opacity="0.8">♪</text>
  <text x="165" y="60" font-size="18" fill="#FF69B4" opacity="0.8">♫</text>
  <text x="20" y="80" font-size="16" fill="#FF8C69" opacity="0.6">♩</text>
</svg>
